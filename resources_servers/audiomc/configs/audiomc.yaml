# AudioMC rubric judge resource server. The candidate policy adapter must use
# Chat Completions with per-turn audio (metadata.audio_refs); the judge is a
# separate chat model server. Values below match the reference judge profile.
audiomc:
  resources_servers:
    audiomc:
      entrypoint: app.py
      domain: other
      verified: false
      description: AudioMC multi-turn spoken-conversation rubric evaluation (APR/ARS)
      scoring_version: legacy_v1
      axis: null
      expected_num_rows: 3
      expected_sample_ids_file: null
      judge_model_server:
        type: responses_api_models
        name: judge_model
      judge_prompt_file: resources_servers/audiomc/prompts/legacy_rubric_v1.yaml
      judge_temperature: 0.0
      judge_top_p: null
      judge_max_tokens: 4096
      judge_attempts: 3
      judge_max_concurrency: 8
audiomc_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: audiomc
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/audiomc/data/example.jsonl
        license: Apache 2.0

audiomc_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: audiomc_simple_agent

# Tau-Voice Simple: Tau2 airline/retail/telecom episodes (v1.0.0, base split)
# with the user simulator's turns spoken by GPT-4o mini TTS. The candidate hears
# every user turn as audio and answers in text or with one tool call per turn.
# User simulator, NL-assertion judge, and TTS share one OpenAI-compatible
# endpoint, read from TAU_VOICE_SIMPLE_LLM_API_BASE / TAU_VOICE_SIMPLE_LLM_API_KEY.
tau_voice_simple:
  resources_servers:
    tau_voice_simple:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Tau2 customer-service episodes with TTS-spoken user turns (speech in, text and tool calls out)
      value: Evaluate spoken multi-turn tool use against a simulated customer.
      interaction_mode: s2t
      max_steps: 100
      max_errors: 10
      episode_timeout_seconds: 1200
      llm_api_base: ${oc.env:TAU_VOICE_SIMPLE_LLM_API_BASE,https://inference-api.nvidia.com/v1}
      llm_api_key: ${oc.env:TAU_VOICE_SIMPLE_LLM_API_KEY,MISSING}
      user_llm: openai/openai/openai/gpt-5.6-luna
      user_llm_args:
        temperature: 1
      nl_assertions_llm: openai/openai/openai/gpt-5.4-mini
      nl_assertions_llm_args:
        temperature: 0.0
      tts_model: openai/openai/gpt-4o-mini-tts
      tau2_data_dir: resources_servers/tau_voice_simple/tau2_data
      audio_archive_path: null
      expected_num_rows: null
      tau2_log_level: WARNING
tau_voice_simple_agent:
  responses_api_agents:
    tau_voice_simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: tau_voice_simple
      model_server:
        type: responses_api_models
        name: policy_model
      protocol_retries: 2
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/tau_voice_simple/data/example.jsonl
        license: MIT

tau_voice_simple_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: tau_voice_simple_agent
